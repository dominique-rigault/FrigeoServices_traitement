# Règles de gestion propres au client, écrites à la main d'après ce que dit le métier.
# Chaque règle est une instance d'un type du catalogue (voir frigeo.gestion.catalogue_types) :
# ref (référence de la règle), libelle (texte affiché), type, table, puis les paramètres du type.
# Une règle qui n'entre dans aucun type demande un nouveau type générique dans src/.
regles:
  - ref: decoupage
    libelle: Date de début dans la période de l'export
    type: date_dans_periode_export
    table: interventions
    colonne: date_debut
  - ref: decoupage
    libelle: Date de l'intervention dans la période de l'export
    type: date_dans_periode_export
    table: pieces_interventions
    colonne: date_sortie
  - ref: decoupage
    libelle: Date de facture dans la période de l'export
    type: date_dans_periode_export
    table: factures_entetes
    colonne: date_facture
  - ref: decoupage
    libelle: Date de facture fournisseur dans la période de l'export
    type: date_dans_periode_export
    table: achats_entetes
    colonne: date_facture
  - ref: decoupage
    libelle: Date d'écriture dans la période de l'export
    type: date_dans_periode_export
    table: fec
    colonne: EcritureDate

  - ref: R02
    libelle: Durée sur site dans la plage de sa catégorie
    type: plage_selon_valeur
    table: interventions
    colonne: duree_min
    selon: categorie
    plages:
      Intervention préventive: {min: 45, max: 150}
      Maintenance: {min: 45, max: 240}
      Dépannage: {min: 30, max: 300}
      Contrôle: {min: 30, max: 90}
      Installation: {min: 120, max: 600}
    filtre:
      - colonne: statut
        valeurs: [Réalisée]
    issue: anomalie
  - ref: R22
    libelle: Distance imputée de 2 à 120 km
    type: plage
    table: interventions
    colonne: distance_km
    min: 2
    max: 120
    filtre:
      - colonne: statut
        valeurs: [Réalisée]
    issue: anomalie
  - ref: R22
    libelle: Vitesse du trajet imputé de 30 à 70 km/h
    type: rapport_dans_plage
    table: interventions
    numerateur: distance_km
    denominateur: duree_trajet_min
    facteur: 60
    min: 30
    max: 70
    filtre:
      - colonne: statut
        valeurs: [Réalisée]
    issue: anomalie

