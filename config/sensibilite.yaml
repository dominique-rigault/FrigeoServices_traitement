  clients: [raison_sociale, siret, adresse, telephone, email]
  fournisseurs: [raison_sociale, siret, adresse]
  intervenants: [nom, prenom, motif_sortie]
  remunerations: [salaire_brut_mensuel]
  factures_entetes: [nom_client]
  achats_entetes: [nom_fournisseur]
  fec: [CompAuxLib]