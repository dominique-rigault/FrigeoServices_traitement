exceptions:
  - motif: 'interventions\.(date_debut|duree_min|duree_trajet_min|distance_km|intervenant|statut|facturable) (obligatoire|nature)'
    etape: format
    gravite: bloquante
  - motif: 'factures_(entetes\.(date_facture|total_ht)|lignes\.(id_intervention|montant_ht)) (obligatoire|nature)'
    etape: format
    gravite: bloquante
  - motif: 'pieces_interventions\.(id_intervention|date_sortie|ref_piece|quantite) (obligatoire|nature)'
    etape: format
    gravite: bloquante
  - motif: '(intervenants\.date_entree|remunerations\.[a-z_]+|parametres_couts\.[a-z_]+) (obligatoire|nature)'
    etape: format
    gravite: bloquante
